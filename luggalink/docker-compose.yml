services:
  postgres:
    image: postgres:16-alpine
    container_name: luggalink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luggalink
      POSTGRES_PASSWORD: luggalink
      POSTGRES_DB: luggalink
    ports:
      - "5432:5432"
    volumes:
      - luggalink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luggalink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luggalink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - luggalink-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  luggalink-postgres-data:
  luggalink-redis-data:
